<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Routes</title>
</head>
<body>
    <h1>Available pages</h1>
    <ul>
        <% if (routes && routes.length) { %>
            <% routes.forEach(function(r, i) { %>
                <li><a href="<%= r.url %>"><%= r.label || ('Route ' + (i+1)) %></a></li>
            <% }) %>
        <% } else { %>
            <li>No routes provided</li>
        <% } %>
    </ul>
</body>
</html>
