<%- include("../partials/auth_header", { title: "Login" }) %>

<div class="container my-5" style="max-width: 640px;">
  <div class="card bg-dark text-white shadow">
    <div class="card-header" style="background: #818181; color: #fff;">
      Login
    </div>
    <div class="card-body">
      <% if (notice) { %>
        <div class="alert alert-warning" role="alert"><%= notice %></div>
      <% } %>
      <% if (typeof error !== 'undefined' && error) { %>
        <div class="alert alert-danger" role="alert"><%= error %></div>
      <% } %>
      <form method="POST" action="/login-34076352">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" placeholder="chef@example.com" value="<%= form?.email || '' %>" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="********" required />
        </div>
        <div class="d-flex justify-content-between align-items-center">
          <a class="btn btn-outline-light" href="/welcome-34076352">Back</a>
          <button class="btn btn-primary" type="submit">Login</button>
        </div>
      </form>
      <div class="mt-3 text-white">New here? <a href="/signup-34076352" class="link-light">Create an account</a></div>
    </div>
  </div>
</div>

<%- include("../partials/footer") %>
